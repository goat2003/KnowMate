apiVersion: batch/v1
kind: Job
metadata:
  name: migration-runner
  namespace: knowmate
  labels:
    app.kubernetes.io/name: migration-runner
spec:
  backoffLimit: 2
  template:
    metadata:
      labels:
        app.kubernetes.io/name: migration-runner
    spec:
      restartPolicy: Never
      serviceAccountName: knowmate-runtime
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        runAsGroup: 10001
        fsGroup: 10001
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: migration-runner
          image: ghcr.io/knowmate/goframe-backend:0.1.0
          imagePullPolicy: IfNotPresent
          command: ["/app/scripts/run_migrations.sh"]
          envFrom:
            - configMapRef:
                name: knowmate-config
          env:
            - name: MYSQL_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: knowmate-secrets
                  key: MYSQL_PASSWORD
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
