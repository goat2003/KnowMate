apiVersion: v1
kind: Service
metadata:
  name: embedding-mcp
  namespace: knowmate
spec:
  ports:
    - name: http
      port: 7001
      targetPort: http
  selector:
    app.kubernetes.io/name: embedding-mcp
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: embedding-mcp
  namespace: knowmate
spec:
  replicas: 2
  selector:
    matchLabels:
      app.kubernetes.io/name: embedding-mcp
  template:
    metadata:
      labels:
        app.kubernetes.io/name: embedding-mcp
    spec:
      serviceAccountName: knowmate-runtime
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        runAsGroup: 10001
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: embedding-mcp
          image: ghcr.io/knowmate/mcp-servers:0.1.0
          ports:
            - name: http
              containerPort: 7001
          envFrom:
            - configMapRef:
                name: knowmate-config
          env:
            - name: MCP_SERVER
              value: embedding-mcp
            - name: MCP_TRANSPORT
              value: streamable_http
            - name: PORT
              value: "7001"
            - name: OPENAI_API_KEY
              valueFrom:
                secretKeyRef:
                  name: knowmate-secrets
                  key: OPENAI_API_KEY
          readinessProbe:
            httpGet:
              path: /health
              port: http
            periodSeconds: 10
            timeoutSeconds: 5
          livenessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 30
            periodSeconds: 20
            timeoutSeconds: 5
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
---
