apiVersion: v1
kind: ConfigMap
metadata:
  name: knowmate-config
  namespace: knowmate
data:
  APP_ENV: "prod"
  MYSQL_HOST: "mysql"
  MYSQL_PORT: "3306"
  MYSQL_DATABASE: "knowledge_post_agent"
  MYSQL_USER: "app"
  GOFRAME_HTTP_ADDR: ":8080"
  AGENT_GRPC_ADDR: "python-agent:50051"
  CONFIG_PATH: "/app/goframe-backend/manifest/config/prod.sources.yaml"
  SCHEMA_PATH: "/app/shared/sql/init.sql"
  OUTPUT_DIR: "/app/shared/outputs"
  LLM_PROVIDER: "openai"
  OPENAI_BASE_URL: "https://api.openai.com/v1"
  OPENAI_MODEL: "gpt-4.1-mini"
  MOCK_MCP: "false"
  MCP_MEMORY_FALLBACK: "false"
  EMBEDDING_PROVIDER: "openai"
  EMBEDDING_MODEL: "text-embedding-3-large"
  EMBEDDING_DIMENSION: "3072"
  MILVUS_PROVIDER: "milvus"
  MILVUS_URI: "http://milvus-standalone:19530"
  MILVUS_COLLECTION: "user_memory_vectors"
  NEO4J_PROVIDER: "neo4j"
  NEO4J_URI: "bolt://neo4j:7687"
  NEO4J_USER: "neo4j"
  NEO4J_DATABASE: "neo4j"
  EMBEDDING_MCP_TRANSPORT: "streamable_http"
  FETCH_MCP_TRANSPORT: "streamable_http"
  MILVUS_MCP_TRANSPORT: "streamable_http"
  NEO4J_MCP_TRANSPORT: "streamable_http"
  EMBEDDING_MCP_URL: "http://embedding-mcp:7001/mcp"
  FETCH_MCP_URL: "http://fetch-mcp:7002/mcp"
  MILVUS_MCP_URL: "http://milvus-mcp:7003/mcp"
  NEO4J_MCP_URL: "http://neo4j-mcp:7004/mcp"
  OTEL_ENABLED: "true"
  OTEL_EXPORTER_OTLP_ENDPOINT: "http://otel-collector:4317"
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: knowmate-crawler-config
  namespace: knowmate
data:
  prod.sources.yaml: |
    crawler:
      user_agent: "KnowMateCrawler/1.0 (+https://github.com/KnowMate)"
      request_timeout_seconds: 20
      retry_times: 3
      retry_backoff_milliseconds: 500
      max_retry_delay_milliseconds: 30000
      per_host_interval_milliseconds: 3000
      max_response_bytes: 10485760
      robots_cache_seconds: 21600
      source_max_items: 8
      run_max_articles: 60
      sources:
        - name: "openai-news"
          type: "feed"
          url: "https://openai.com/news/rss.xml"
          enabled: true
          max_items: 8
        - name: "langchain-blog"
          type: "feed"
          url: "https://www.langchain.com/blog/rss.xml"
          enabled: true
          max_items: 8
        - name: "google-research"
          type: "feed"
          url: "https://research.google/blog/rss/"
          enabled: true
          max_items: 8
        - name: "huggingface-blog"
          type: "feed"
          url: "https://huggingface.co/blog/feed.xml"
          enabled: true
          max_items: 8
        - name: "arxiv-cs-ai"
          type: "arxiv"
          url: "https://export.arxiv.org/api/query?search_query=cat:cs.AI&sortBy=submittedDate&sortOrder=descending&max_results=25"
          enabled: true
          max_items: 8
        - name: "arxiv-cs-lg"
          type: "arxiv"
          url: "https://export.arxiv.org/api/query?search_query=cat:cs.LG&sortBy=submittedDate&sortOrder=descending&max_results=25"
          enabled: true
          max_items: 8
        - name: "arxiv-cs-cl"
          type: "arxiv"
          url: "https://export.arxiv.org/api/query?search_query=cat:cs.CL&sortBy=submittedDate&sortOrder=descending&max_results=25"
          enabled: true
          max_items: 8
        - name: "arxiv-cs-cv"
          type: "arxiv"
          url: "https://export.arxiv.org/api/query?search_query=cat:cs.CV&sortBy=submittedDate&sortOrder=descending&max_results=25"
          enabled: true
          max_items: 8
        - name: "openai-agents-python-releases"
          type: "github_release"
          url: "https://github.com/openai/openai-agents-python/releases.atom"
          enabled: true
          max_items: 5
        - name: "langchain-releases"
          type: "github_release"
          url: "https://github.com/langchain-ai/langchain/releases.atom"
          enabled: true
          max_items: 5
        - name: "mcp-python-sdk-releases"
          type: "github_release"
          url: "https://github.com/modelcontextprotocol/python-sdk/releases.atom"
          enabled: true
          max_items: 5
        - name: "milvus-releases"
          type: "github_release"
          url: "https://github.com/milvus-io/milvus/releases.atom"
          enabled: true
          max_items: 5
        - name: "neo4j-releases"
          type: "github_release"
          url: "https://github.com/neo4j/neo4j/releases.atom"
          enabled: true
          max_items: 5
        # Official page: https://huggingface.co/papers
        # Current adapter expects RSS/Atom. The official /papers/rss endpoint
        # returned 401 in verification, so this remains disabled until official
        # RSS/API access or adapter support is confirmed.
        - name: "huggingface-daily-papers"
          type: "huggingface_papers"
          url: "https://huggingface.co/papers/rss"
          enabled: false
          max_items: 5
        # Local-only smoke source. Keep disabled in production.
        - name: "local-mock-knowledge-feed"
          type: "mock"
          url: "mock://sample"
          enabled: false
          max_items: 2
