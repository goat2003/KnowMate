# Production crawler source example for KnowMate.
# Copy this file to configs/crawler/prod.sources.yaml or point
# CRAWLER_CONFIG_PATH at another reviewed file before deployment.
#
# Source review baseline, verified from this workspace on 2026-06-10:
# - arXiv URLs use the official export API.
# - GitHub release feeds use each repository's official /releases.atom endpoint.
# - General feeds are official RSS endpoints.
# - Hugging Face Daily Papers has a public HTML page, but /papers/rss returned
#   401 during verification. Keep that adapter disabled until official RSS/API
#   access is confirmed or the adapter is extended to parse the official page.
# - mock is local smoke-test only and must stay disabled for production.
crawler:
  user_agent: "KnowMateCrawler/1.0 (+https://github.com/KnowMate)"
  request_timeout_seconds: 20
  retry_times: 3
  retry_backoff_milliseconds: 500
  max_retry_delay_milliseconds: 30000
  per_host_interval_milliseconds: 3000
  max_response_bytes: 10485760
  robots_cache_seconds: 21600
  source_max_items: 8
  run_max_articles: 60
  sources:
    - name: "openai-news"
      type: "feed"
      url: "https://openai.com/news/rss.xml"
      enabled: true
      max_items: 8
    - name: "langchain-blog"
      type: "feed"
      url: "https://www.langchain.com/blog/rss.xml"
      enabled: true
      max_items: 8
    - name: "google-research"
      type: "feed"
      url: "https://research.google/blog/rss/"
      enabled: true
      max_items: 8
    - name: "huggingface-blog"
      type: "feed"
      url: "https://huggingface.co/blog/feed.xml"
      enabled: true
      max_items: 8

    - name: "arxiv-cs-ai"
      type: "arxiv"
      url: "https://export.arxiv.org/api/query?search_query=cat:cs.AI&sortBy=submittedDate&sortOrder=descending&max_results=25"
      enabled: true
      max_items: 8
    - name: "arxiv-cs-lg"
      type: "arxiv"
      url: "https://export.arxiv.org/api/query?search_query=cat:cs.LG&sortBy=submittedDate&sortOrder=descending&max_results=25"
      enabled: true
      max_items: 8
    - name: "arxiv-cs-cl"
      type: "arxiv"
      url: "https://export.arxiv.org/api/query?search_query=cat:cs.CL&sortBy=submittedDate&sortOrder=descending&max_results=25"
      enabled: true
      max_items: 8
    - name: "arxiv-cs-cv"
      type: "arxiv"
      url: "https://export.arxiv.org/api/query?search_query=cat:cs.CV&sortBy=submittedDate&sortOrder=descending&max_results=25"
      enabled: true
      max_items: 8

    - name: "openai-agents-python-releases"
      type: "github_release"
      url: "https://github.com/openai/openai-agents-python/releases.atom"
      enabled: true
      max_items: 5
    - name: "langchain-releases"
      type: "github_release"
      url: "https://github.com/langchain-ai/langchain/releases.atom"
      enabled: true
      max_items: 5
    - name: "mcp-python-sdk-releases"
      type: "github_release"
      url: "https://github.com/modelcontextprotocol/python-sdk/releases.atom"
      enabled: true
      max_items: 5
    - name: "milvus-releases"
      type: "github_release"
      url: "https://github.com/milvus-io/milvus/releases.atom"
      enabled: true
      max_items: 5
    - name: "neo4j-releases"
      type: "github_release"
      url: "https://github.com/neo4j/neo4j/releases.atom"
      enabled: true
      max_items: 5

    # Official page: https://huggingface.co/papers
    # Current adapter expects RSS/Atom. The official /papers/rss endpoint returned
    # 401 in verification, so this remains disabled. Do not replace it with a
    # third-party mirror unless authorization, freshness, rate limits, and robots
    # policy are reviewed for the target environment.
    - name: "huggingface-daily-papers"
      type: "huggingface_papers"
      url: "https://huggingface.co/papers/rss"
      enabled: false
      max_items: 5

    # Local-only smoke source. Keep disabled in production.
    - name: "local-mock-knowledge-feed"
      type: "mock"
      url: "mock://sample"
      enabled: false
      max_items: 2
