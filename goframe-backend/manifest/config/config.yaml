server:
  address: ":8080"

agent:
  address: "127.0.0.1:50051"
  timeout_seconds: 8
  retry_times: 3
  auth_token: ""

security:
  api_token: ""
  max_request_body_bytes: 1048576
  rate_limit_burst: 120

mysql:
  dsn: "app:apppass@tcp(127.0.0.1:3306)/knowledge_post_agent?charset=utf8mb4&parseTime=true&loc=Local"

schema:
  path: "../shared/sql/init.sql"

crawler:
  user_agent: "KnowMateCrawler/1.0"
  request_timeout_seconds: 10
  retry_times: 3
  retry_backoff_milliseconds: 250
  max_retry_delay_milliseconds: 30000
  per_host_interval_milliseconds: 500
  max_response_bytes: 5242880
  robots_cache_seconds: 3600
  source_max_items: 10
  run_max_articles: 20
  sources:
    - name: "mock-knowledge-feed"
      type: "mock"
      url: "mock://sample"
      enabled: true
      max_items: 5

harness:
  max_concurrent_tasks: 2
  task_timeout_seconds: 120
  step_max_retries: 3
  retry_backoff_milliseconds: 200
  max_retry_delay_milliseconds: 5000

output:
  dir: "../shared/outputs"

profile:
  user_id: "default-user"
  interests: "AI,knowledge-management,engineering"
